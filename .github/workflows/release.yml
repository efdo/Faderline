name: Release app DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published release tag to rebuild (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package-app:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPECTED_XCODE_VERSION: '26.6'
      EXPECTED_XCODE_BUILD: '17F113'
      EXPECTED_DTXCODE: '2660'
      EXPECTED_MACOS_SDK_VERSION: '26.5'
      EXPECTED_SWIFT_VERSION: '6.3.3'
      EXPECTED_SWIFT_BUILD: 'swiftlang-6.3.3.1.3'
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SIGNING_MODE: ${{ vars.RELEASE_SIGNING_MODE || 'unsigned-development' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate release and signing mode
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag must be vX.Y.Z." >&2
            exit 1
          }
          case "$SIGNING_MODE" in
            unsigned-development|developer-id) ;;
            *) echo "Invalid RELEASE_SIGNING_MODE: $SIGNING_MODE" >&2; exit 1 ;;
          esac
          # Manual retries must target a published release, not just an existing tag.
          [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == false ]]
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Check out toolchain verification from workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-toolchain
          persist-credentials: false

      - name: Report and verify selected build environment
        run: python3 .ci-toolchain/scripts/verify-build-environment.py

      - name: Label unsigned development release
        if: env.SIGNING_MODE == 'unsigned-development'
        shell: bash
        run: |
          set -euo pipefail
          title="$(gh release view "$TAG" --json name --jq .name)"
          title="${title:-$TAG}"
          case "$title" in
            *"(unsigned development)"*) ;;
            *) title="$title (unsigned development)" ;;
          esac
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/original-notes.md"
          banner="**Unsigned development artifacts: NOT Developer ID signed or notarized. macOS Gatekeeper may block these builds.**"
          if grep -Fq "$banner" "$RUNNER_TEMP/original-notes.md"; then
            cp "$RUNNER_TEMP/original-notes.md" "$RUNNER_TEMP/release-notes.md"
          else
            printf '%s\n\n' "$banner" > "$RUNNER_TEMP/release-notes.md"
            cat "$RUNNER_TEMP/original-notes.md" >> "$RUNNER_TEMP/release-notes.md"
          fi
          gh release edit "$TAG" --title "$title" --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Prepare isolated presentation tooling
        if: ${{ hashFiles('scripts/packaging-requirements.txt') != '' }}
        run: |
          python3 -m venv .build/packaging-venv
          .build/packaging-venv/bin/python -m pip install -r scripts/packaging-requirements.txt

      - name: Build package and run repository tests
        run: |
          set -euo pipefail
          swift build
          swift Tests/FaderlineTests/FaderlineTests.swift
          swift test
          if [[ -f scripts/packaging-requirements.txt ]]; then
            .build/packaging-venv/bin/python -m unittest discover -s Tests/ReleasePackagingTests -v
          else
            echo "Release tag predates presentation tooling; running its dependency-free packaging tests."
            python3 -m unittest discover -s Tests/ReleasePackagingTests -v
          fi
          python3 -m unittest discover -s .ci-toolchain/Tests/BuildEnvironmentTests -v

      - name: Prepare Developer ID signing and notarization
        if: env.SIGNING_MODE == 'developer-id'
        env:
          APPLICATION_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$APPLICATION_CERTIFICATE_P12" && -n "$APPLICATION_CERTIFICATE_PASSWORD" \
            && -n "$KEYCHAIN_PASSWORD" && -n "$SIGNING_IDENTITY" && -n "$APPLE_TEAM_ID" \
            && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]] || {
            echo "Developer ID mode requires all signing and notarization secrets; see docs/RELEASING.md." >&2
            exit 1
          }
          keychain="$RUNNER_TEMP/app-release-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id-application.p12"
          printf '%s' "$APPLICATION_CERTIFICATE_P12" | base64 -D > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLICATION_CERTIFICATE_PASSWORD" \
            -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          rm "$certificate"
          xcrun notarytool store-credentials app-release \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$keychain"

      - name: Package unsigned development DMG
        if: env.SIGNING_MODE == 'unsigned-development'
        run: |
          bash scripts/package-app.sh --version "${TAG#v}" \
            --build-number "$GITHUB_RUN_NUMBER" --unsigned-development

      - name: Package Developer ID signed and notarized DMG
        if: env.SIGNING_MODE == 'developer-id'
        env:
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          bash scripts/package-app.sh --version "${TAG#v}" \
            --build-number "$GITHUB_RUN_NUMBER" --developer-id "$SIGNING_IDENTITY" \
            --notary-profile app-release

      - name: Verify packaged app SDK and deployment requirements
        run: python3 .ci-toolchain/scripts/verify-build-environment.py --app dist/*/Faderline.app

      - name: Retain DMG and checksum as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Faderline-${{ steps.release.outputs.version }}-${{ env.SIGNING_MODE }}
          path: |
            dist/*/*.dmg
            dist/*/*.sha256
          if-no-files-found: error

      - name: Attach DMG and checksum to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*/*.dmg dist/*/*.sha256 --clobber

      - name: Remove temporary signing credentials
        if: always() && env.SIGNING_MODE == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/developer-id-application.p12"
          if [[ -f "$RUNNER_TEMP/app-release-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/app-release-signing.keychain-db"
          fi
