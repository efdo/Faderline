name: macOS

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build package
        run: swift build

      - name: Run standalone tests
        run: swift Tests/FaderlineTests/FaderlineTests.swift

      - name: Run XCTest suite
        run: swift test

      - name: Prepare isolated presentation tooling
        run: |
          python3 -m venv .build/packaging-venv
          .build/packaging-venv/bin/python -m pip install -r scripts/packaging-requirements.txt

      - name: Test app packaging and Finder presentation
        run: .build/packaging-venv/bin/python -m unittest discover -s Tests/ReleasePackagingTests -v

      - name: Build and inspect app-only development DMG
        run: bash scripts/package-app.sh --version 0.0.0 --unsigned-development
